# Production stack for the store-builder (client-server install).
#
#   docker compose -f docker/docker-compose.prod.yml --profile mail up -d --build
#
# Differences from the dev compose on purpose:
#   - no pgadmin / elasticsearch / host-port publishing of internal
#     services (the browser only reaches web :8080 and the minio
#     console :9001 when you opt in with --profile minio-console)
#   - api and web are built from Dockerfile.api / Dockerfile.web at the
#     repo root and talk over the internal network
#   - the API entrypoint runs `prisma migrate deploy` before boot, so
#     the database converges to this build's schema automatically
version: '3.8'

services:
  # PostgreSQL is OPT-IN (README section 5). The store runs on SQLite by
  # default, so this service does not start unless the profile is requested:
  #
  #     docker compose --profile postgres up
  #
  # Behind a profile rather than deleted: it stays available for anyone who
  # switches, and - importantly - it no longer forces every SQLite deployment
  # to invent a POSTGRES_PASSWORD for a database nothing connects to.
  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: store_db
      POSTGRES_USER: store_user
      # Mandatory (:? not :-). A silent default means a production
      # database reachable with a password published in this repo.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - store-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store_user -d store_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - store-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # Mandatory: these are the object-store root credentials. A default
      # here hands anyone who reads this file every uploaded file.
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in the environment}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY (8+ chars) in the environment}
    volumes:
      - minio_data:/data
    networks:
      - store-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Optional: SMTP sink so order emails are visible without a real
  # mail server (http://localhost:8025). Remove the profile flag for
  # a lean install.
  mailhog:
    image: mailhog/mailhog:latest
    profiles: ["mail"]
    restart: unless-stopped
    networks:
      - store-network

  api:
    build:
      context: ..
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3001"
      API_VERSION: v1
      # SQLite on a named volume. This MUST match `provider` in
      # apps/api/prisma/schema.prisma - a mismatch is Prisma P1012 and the
      # API refuses to boot (see src/config/verifyDatabaseUrl.ts). The
      # committed migration history is also locked to sqlite
      # (prisma/migrations/migration_lock.toml), so a postgresql:// URL here
      # could not be migrated even if the provider were changed.
      #
      # To run PostgreSQL instead, follow README section 5: change the
      # provider, regenerate the migration history against Postgres, then
      # swap this line and re-enable the postgres service below.
      DATABASE_URL: file:/app/apps/api/data/store.db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (32+ chars) in the environment}
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_EXPIRES_IN: 30d
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in the environment}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY (8+ chars) in the environment}
      MINIO_BUCKET: store-files
      MINIO_USE_SSL: "false"
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: "1025"
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@yourstore.com}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      CORS_ORIGIN: ${FRONTEND_URL:-http://localhost:8080}
      LOG_LEVEL: info
      # Installed themes live in the shared volume; the entrypoint seeds the
      # bundled themes into it on first boot (see scripts/entrypoint-api.sh).
      THEMES_DIR: /app/apps/web/themes
      # Installed plugins live here (file-based, no DB). The entrypoint
      # creates it on boot.
      PLUGINS_DIR: /app/apps/api/plugins
    volumes:
      # The SQLite file lives here. Without a volume the entire store is lost
      # the moment the container is replaced - which `restart: unless-stopped`
      # and any image update both do routinely.
      - db_data:/app/apps/api/data
      - themes_data:/app/apps/web/themes
      - plugins_data:/app/apps/api/plugins
    networks:
      - store-network

  web:
    build:
      context: ..
      dockerfile: Dockerfile.web
      args:
        # The URL the CUSTOMER'S BROWSER uses to reach the API.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3001/api}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "${WEB_PORT:-8080}:3000"
    networks:
      - store-network

volumes:
  # SQLite database file (see the api service's DATABASE_URL).
  db_data:
  # Retained so an existing deployment's Postgres data is not orphaned by
  # this change. Unused while the store runs on SQLite.
  postgres_data:
  redis_data:
  minio_data:
  # Shared with the web container's themes dir so themes the admin installs
  # at runtime survive restarts and are readable by the storefront via the
  # API catalog (GET /api/themes).
  themes_data:
  # Installed plugin packages + state survive restarts (file-based storage).
  plugins_data:

networks:
  store-network:
    driver: bridge
